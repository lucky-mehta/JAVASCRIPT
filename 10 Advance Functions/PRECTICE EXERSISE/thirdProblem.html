<!-- Create a button which should grow double in size on clicking after 2 seconds. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECTICE SET LEVEL 10</title>
  <style>
    .btn-subscribe{
      font-size: 15px;
      height: 20px;
      width: 80px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 2px;
    }
    .js-size-double{
      height: 40px;
      width: 160px;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <button class="btn-subscribe" onclick="
    setTimeout(doubleTheSize,2000);">Subscribe</button>
  <script>
    function doubleTheSize(){
      let buttonElement = document.querySelector('.btn-subscribe');
      buttonElement.classList.add('js-size-double');
    }
  </script>
</body>
</html>
