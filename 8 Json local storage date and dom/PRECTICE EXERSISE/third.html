<!-- Create a button which shows the number how many times it has be pressed.
 . Also it has different color for when it has been pressed odd or even times.
 . The click count should also servive browser referesh. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECICE SET 8</title>
  <style>
    #my-button{
      height: 50px;
      width: 50px;
      font-size: 25px;
      border: none;
      border-radius: 5px;
    }
    .js-odd{
      background-color: chocolate;
    }
    .js-even{
      background-color: lawngreen;
    }
  </style>
</head>
<body>
<button id="my-button" onclick="buttonPressed();">0</button>
  <script>
    
let noOfTimesClicked= localStorage.getItem('noOfTimesClicked') || 0;
function buttonPressed(){
  noOfTimesClicked++;
 localStorage.setItem('noOfTimesClicked',noOfTimesClicked); 
  updateButton();
}
function updateButton(){

  let button = document.querySelector('#my-button');
  if(noOfTimesClicked % 2==0){
    button.classList.remove('js-odd');
    button.classList.add('js-even');
  }else{
    button.classList.remove('js-even');
    button.classList.add('js-odd');
  }
  button.innerText = noOfTimesClicked;
}
updateButton();

  </script>
</body>
</html>
