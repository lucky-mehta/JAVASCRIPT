<!-- Display good morning,afternoon and night based on current hour. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECICE SET 8</title>
</head>
<body>
  <h3 id="greeting"></h3>
  <script>
let date = new Date ();
let hours = date.getHours();
let heading = document.querySelector('#greeting');
console.log(hours);
if(hours > 5 && hours < 12){
  heading.innerText = 'Good Morning';
}else if(hours >12 && hours< 18){
  heading.innerText = 'Good Afternoon';
}else{
  heading.innerText = 'Good Night';
}

  </script>
</body>
</html>
