// GIVEN AN OBJECT {message:'Good Job',status:'complete'}, USE DE-STRUCTURING TO CREATE TWO VARIABLES MESSAGE AND STATUS.
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECTICE SET 7</title>
</head>
<body>
  <script>
    let obj ={
      message:'Good Job',
      status:'Complete',
    };
    console.log(obj);
    let {message,status}=obj;
    console.log(message);
    console.log(status);
  </script>
</body>
</html>
