<!-- Create a method to check if a number is odd and even. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECTICE SET 6</title>
</head>
<body>
  
  <script>
    function isEven(number){
      let result;
      if(number%2===0){
      result='even';
      }else{
        result = 'odd';
      }
      return result;
    }
    console.log(isEven(10));
     console.log(isEven(105));
      console.log(isEven(16));
       console.log(isEven(1102));
      </script>
</body>
</html>
