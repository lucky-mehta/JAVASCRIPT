<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prectice set level 9</title>
</head>
<body>
  <script>
    function isPrime(num){
    for(let i = 2 ; i<num;i++){
      if(num%i === 0){
        return false;
      }
    }
    return true;
   }
   console.log(isPrime(5));
   console.log(isPrime(10));
   console.log(isPrime(17));

   let num = 2;
   let i = 0;
   while(true){
    if(isPrime(num)){
      console.log(num);
      i++;
      if(i>=5){
        break;
      }
    }
    num++;
   }
  
  </script>
</body>
</html>
