<!-- Create an array of number [5,6].Add 4 at the beginning and 7 at the end of the array. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prectice Set Level 9</title>
</head>
<body>
  <script>
    let arr = [5,6];
    console.log(arr);
    arr.unshift(4);
    console.log(arr);
    arr.push(7);
    console.log(arr);
  </script>
</body>
</html>
